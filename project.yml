name: Magnetometer
options:
  bundleIdPrefix: com.wormshadow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Magnetometer:
    type: application
    platform: iOS
    sources:
      - path: Magnetometer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wormshadow.magnetometer
        PRODUCT_NAME: Magnetometer
        INFOPLIST_FILE: Magnetometer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
